<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>淺海生態探索 · Shallow Sea Interactive</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖標庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="relative w-screen h-screen overflow-hidden bg-slate-900">

  <!-- 主畫布 (全螢幕 Canvas) -->
  <canvas id="seaCanvas" class="absolute inset-0 w-full h-full block cursor-crosshair z-0"></canvas>

  <!-- 頂部資訊與快捷按鈕列 -->
  <header class="absolute top-4 left-4 right-4 z-20 flex items-center justify-between pointer-events-none">
    <!-- 標題與生態狀態 -->
    <div class="pointer-events-auto flex items-center gap-3">
      <div class="glass-panel px-4 py-2 rounded-2xl flex items-center gap-3 text-white transition-all hover:bg-white/25">
        <div class="w-8 h-8 rounded-full bg-cyan-400/30 flex items-center justify-center border border-cyan-200/50 shadow-inner">
          <i class="fa-solid fa-water text-cyan-200 text-sm"></i>
        </div>
        <div>
          <h1 class="text-sm md:text-base font-bold tracking-wide text-white drop-shadow-sm flex items-center gap-1.5">
            淺海生態探索
            <span id="timeBadge" class="text-[10px] font-normal px-2 py-0.5 rounded-full bg-cyan-500/30 border border-cyan-300/40 text-cyan-100">正午陽光</span>
          </h1>
          <p class="text-[11px] text-cyan-100/80 drop-shadow">觸摸水面激起微瀾 · 點擊海生觀察習性</p>
        </div>
      </div>
    </div>

    <!-- 右側功能鍵：圖鑑、聲音切換 -->
    <div class="pointer-events-auto flex items-center gap-2">
      <!-- 圖鑑按鈕 (附探索進度小紅點/Badge) -->
      <button id="journalBtn" class="glass-panel px-3.5 py-2 rounded-2xl text-white hover:bg-white/30 active:scale-95 transition-all flex items-center gap-2 shadow-lg">
        <i class="fa-solid fa-book-bookmark text-amber-300"></i>
        <span class="text-xs font-medium hidden sm:inline">淺海圖鑑</span>
        <span id="journalCountBadge" class="text-[11px] font-bold px-2 py-0.2 rounded-full bg-amber-400 text-slate-900">0/7</span>
      </button>

      <!-- 自然環境音效開關 -->
      <button id="soundToggleBtn" class="glass-panel w-10 h-10 rounded-2xl text-white hover:bg-white/30 active:scale-95 transition-all flex items-center justify-center shadow-lg">
        <i id="soundIcon" class="fa-solid fa-volume-xmark text-white/80"></i>
      </button>
    </div>
  </header>

  <!-- 底部中央浮動互動 Dock -->
  <div class="absolute bottom-5 left-1/2 -translate-x-1/2 z-20 w-[92%] max-w-xl pointer-events-auto">
    <div class="glass-panel px-3 py-2.5 rounded-3xl flex items-center justify-between gap-1 shadow-2xl border border-white/30">
      
      <!-- 互動模式：觀察 VS 撒飼料 -->
      <div class="flex items-center bg-black/20 p-1 rounded-2xl">
        <button id="modeInspectBtn" class="px-3 py-1.5 rounded-xl text-xs font-medium transition-all flex items-center gap-1.5 text-white bg-white/30 shadow-sm">
          <i class="fa-solid fa-hand-pointer text-cyan-200"></i>
          <span class="hidden sm:inline">互動觀察</span>
        </button>
        <button id="modeFeedBtn" class="px-3 py-1.5 rounded-xl text-xs font-medium transition-all flex items-center gap-1.5 text-white/70 hover:text-white">
          <i class="fa-solid fa-bowl-food text-amber-300"></i>
          <span class="hidden sm:inline">撒飼料</span>
        </button>
      </div>

      <div class="h-6 w-[1px] bg-white/20 mx-1 hidden sm:block"></div>

      <!-- 光影時空切換 -->
      <div class="flex items-center gap-1">
        <button data-time="noon" class="time-btn w-8 h-8 rounded-xl flex items-center justify-center text-amber-300 bg-white/30 hover:bg-white/40 transition active:scale-90" title="正午陽光">
          <i class="fa-solid fa-sun text-sm"></i>
        </button>
        <button data-time="sunset" class="time-btn w-8 h-8 rounded-xl flex items-center justify-center text-orange-300/70 hover:text-orange-200 hover:bg-white/20 transition active:scale-90" title="黃昏金暈">
          <i class="fa-solid fa-cloud-sun text-sm"></i>
        </button>
        <button data-time="night" class="time-btn w-8 h-8 rounded-xl flex items-center justify-center text-indigo-300/70 hover:text-indigo-200 hover:bg-white/20 transition active:scale-90" title="靜謐夜光">
          <i class="fa-solid fa-moon text-sm"></i>
        </button>
      </div>

      <div class="h-6 w-[1px] bg-white/20 mx-1"></div>

      <!-- 召喚生物按鈕 -->
      <button id="summonBtn" class="px-3 py-1.5 rounded-2xl bg-gradient-to-r from-teal-400 to-cyan-500 text-slate-950 font-semibold text-xs flex items-center gap-1.5 shadow-md hover:brightness-110 active:scale-95 transition">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>召喚新物種</span>
      </button>

    </div>
  </div>

  <!-- 生物速覽彈窗 (點擊生物時出現) -->
  <div id="creatureCard" class="fixed z-30 left-1/2 bottom-24 -translate-x-1/2 w-[90%] max-w-sm glass-panel-dark rounded-3xl p-4 text-white shadow-2xl transition-all duration-300 transform scale-95 opacity-0 pointer-events-none">
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-3">
        <div id="cardIconBg" class="w-12 h-12 rounded-2xl bg-cyan-500/20 flex items-center justify-center border border-cyan-400/40 text-2xl shadow-inner">
          <span id="cardIcon">🐠</span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h3 id="cardName" class="text-base font-bold tracking-wide">小丑魚</h3>
            <span id="cardTag" class="text-[10px] px-2 py-0.5 rounded-full bg-cyan-400/20 text-cyan-200 border border-cyan-400/30">共生生態</span>
          </div>
          <p id="cardSciName" class="text-xs text-white/50 italic">Amphiprioninae</p>
        </div>
      </div>
      <button id="closeCardBtn" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white/70 active:scale-90">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
    </div>
    <div class="mt-3 pt-3 border-t border-white/10 text-xs text-cyan-100/90 leading-relaxed font-light">
      <p id="cardDesc">身上帶有特殊的黏液保護層，能毫髮無傷地穿梭於海葵有毒的觸手之間，兩者互相依偎共生，是淺海珊瑚礁中最受歡迎的小精靈。</p>
    </div>
    <div class="mt-3 flex items-center justify-between text-[11px] text-white/50">
      <span id="cardActionHint" class="flex items-center gap-1 text-cyan-300">
        <i class="fa-solid fa-circle-info"></i> 已收錄至圖鑑
      </span>
      <span class="text-amber-300/80">點擊任意處繼續巡航</span>
    </div>
  </div>

  <!-- 圖鑑列表 Modal (Discovery Journal) -->
  <div id="journalModal" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 transition-all duration-300 opacity-0 pointer-events-none">
    <div class="w-full max-w-lg glass-panel-dark rounded-3xl p-6 text-white border border-white/20 max-h-[85vh] flex flex-col shadow-2xl">
      <!-- 頂部標題與關閉 -->
      <div class="flex items-center justify-between pb-4 border-b border-white/10">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-2xl bg-amber-400/20 flex items-center justify-center border border-amber-300/40 text-amber-300">
            <i class="fa-solid fa-compass"></i>
          </div>
          <div>
            <h2 class="text-lg font-bold">淺海生態圖鑑</h2>
            <p class="text-xs text-white/60">探索記錄與珊瑚礁生物百科</p>
          </div>
        </div>
        <button id="closeJournalBtn" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white/80 active:scale-90">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- 圖鑑進度條 -->
      <div class="my-4 bg-white/5 p-3.5 rounded-2xl border border-white/10">
        <div class="flex items-center justify-between text-xs mb-2">
          <span class="text-white/80">已探索物種進度</span>
          <span id="journalProgressText" class="font-bold text-amber-300">0 / 7 (0%)</span>
        </div>
        <div class="w-full h-2.5 bg-black/30 rounded-full overflow-hidden p-0.5 border border-white/10">
          <div id="journalProgressBar" class="h-full bg-gradient-to-r from-amber-400 to-cyan-400 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
        <p id="journalRewardHint" class="text-[11px] text-cyan-200/70 mt-2 flex items-center gap-1.5">
          <i class="fa-solid fa-gift text-amber-300"></i> 收集全部 7 種生物，將可召喚巨大的「深海巨獸·溫柔鯨鯊」游過淺灘！
        </p>
      </div>

      <!-- 生物卡片網格 (滾動區) -->
      <div id="journalGrid" class="flex-1 overflow-y-auto no-scrollbar space-y-3 pr-1">
        <!-- 動態由 JS 填充 -->
      </div>

      <!-- 底部彩蛋提示或快速召喚 -->
      <div class="pt-4 mt-2 border-t border-white/10 flex items-center justify-between">
        <span class="text-xs text-white/40">點擊已解鎖卡片可將其召喚至中心</span>
        <button id="eggSummonBtn" class="hidden px-4 py-1.5 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-bold text-xs shadow-lg hover:brightness-110 active:scale-95 transition">
          <i class="fa-solid fa-crown mr-1"></i> 召喚巡遊鯨鯊
        </button>
      </div>
    </div>
  </div>

  <!-- 提示浮動小氣泡 (Toast) -->
  <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 glass-panel px-4 py-2 rounded-full text-xs text-white font-medium shadow-xl transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2">
    <i class="fa-solid fa-circle-check text-cyan-300"></i>
    <span id="toastMsg">提示訊息</span>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
